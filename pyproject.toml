[project]
name = "wwlocal"
version = "0.1.0"
description = "Local mirror + browser for WaterlooWorks co-op postings"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.12",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.45",
]

[project.scripts]
wwlocal = "wwlocal.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wwlocal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "RET", "C4"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
